apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: productionops-ingress
  namespace: productionops
spec:
  ingressClassName: nginx
  rules:
    - host: productionops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: production-app
                port:
                  number: 80
