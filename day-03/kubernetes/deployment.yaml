apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-app
  namespace: productionops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: production-app
  template:
    metadata:
      labels:
        app: production-app
    spec:
      containers:
        - name: production-app
          image: production-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
